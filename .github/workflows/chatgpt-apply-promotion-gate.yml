name: ChatGPT apply promotion gate fix

on:
  push:
    branches: [chatgpt/futures-promotion-gate-20260901]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Repair test-fixture escaping and apply exact audited edit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/_chatgpt_apply_promotion_gate.py")
          text = p.read_text(encoding="utf-8")
          old = '        "position_rules:\\n  max_contracts_per_instrument:\\n    MNQ: 6\\n",\n'
          new = '        "position_rules:\\\\n"\n        "  max_contracts_per_instrument:\\\\n"\n        "    MNQ: 6\\\\n",\n'
          if text.count(old) != 1:
              raise SystemExit(f"expected one fixture string, found {text.count(old)}")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python scripts/_chatgpt_apply_promotion_gate.py
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run targeted promotion tests
        run: pytest -q tests/test_project_check_promotion.py
      - name: Commit verified edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: make promotion gate fail closed"
          git push origin HEAD:chatgpt/futures-promotion-gate-20260901
