name: ChatGPT apply futures parity fix

on:
  push:
    branches: [chatgpt-write-check-20260901]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Apply exact audited edit
        run: python scripts/_chatgpt_apply_futures_parity.py
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run targeted regression tests
        run: pytest -q tests/test_runner_wiring.py tests/test_paper_broker.py
      - name: Commit verified edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align paper broker with replay fill config"
          git push origin HEAD:chatgpt-write-check-20260901
