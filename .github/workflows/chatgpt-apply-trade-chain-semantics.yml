name: ChatGPT apply trade-chain semantics fix

on:
  push:
    branches: [chatgpt/futures-trade-chain-semantics-20260901]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Apply exact audited edit
        run: |
          python scripts/_chatgpt_apply_trade_chain_semantics.py
          # The legacy-compatibility test must use an actually classified
          # no-fill reason; the first draft used a generic label that the
          # existing taxonomy correctly treats as unknown.
          sed -i 's/exit_reason="legacy cancel"/exit_reason="IOC limit expired"/' tests/test_project_check_trade_chain.py
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run targeted trade-chain tests
        run: pytest -q tests/test_project_check_trade_chain.py
      - name: Commit verified edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: reconcile current trade-intent cancellations"
          git push origin HEAD:chatgpt/futures-trade-chain-semantics-20260901
