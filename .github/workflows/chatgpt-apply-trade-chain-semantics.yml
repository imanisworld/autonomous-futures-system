name: ChatGPT apply trade-chain semantics fix

on:
  push:
    branches: [chatgpt/futures-trade-chain-semantics-20260901]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Apply exact audited edit
        run: |
          python scripts/_chatgpt_apply_trade_chain_semantics.py
          # Current-format TRADE_INTENT cancellations are joined before confirmed
          # TRADE outcomes. A legacy TRADE->CANCELLED row is intentionally left
          # for the confirmed-trade fallback; once that fallback consumes it, do
          # not also keep the same row in the unmatched-intent set.
          python - <<'PY'
          from pathlib import Path
          p = Path("ops/project_check/trade_chain.py")
          text = p.read_text(encoding="utf-8")
          old = '''    unmatched_outcomes_all = unmatched_confirmed_outcomes + unmatched_intent_cancellations
'''
          new = '''    confirmed_outcome_ids = {id(row) for row in outcome_by_attempt.values()}
    unmatched_intent_cancellations = [
        row for row in unmatched_intent_cancellations
        if id(row) not in confirmed_outcome_ids
    ]
    unmatched_outcomes_all = unmatched_confirmed_outcomes + unmatched_intent_cancellations
'''
          if text.count(old) != 1:
              raise SystemExit("expected one unmatched-outcome merge point")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          # Use a cancellation reason classified by the existing no-fill taxonomy.
          sed -i 's/exit_reason="legacy cancel"/exit_reason="IOC limit expired"/' tests/test_project_check_trade_chain.py
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run targeted trade-chain tests
        run: pytest -q tests/test_project_check_trade_chain.py
      - name: Commit verified edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: reconcile current trade-intent cancellations"
          git push origin HEAD:chatgpt/futures-trade-chain-semantics-20260901
