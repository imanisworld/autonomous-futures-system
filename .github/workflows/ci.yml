name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install and verify locked runtime
        run: |
          python -m pip install --no-deps -r requirements.lock
          python -m pip check
          python -m pip freeze > /tmp/runtime-freeze.txt
          python -m ops.dependency_lock check-python
          python -m ops.dependency_lock check-requirements --lock requirements.lock --requirements requirements.txt
          python -m ops.dependency_lock check-freeze --lock requirements.lock --freeze /tmp/runtime-freeze.txt
      - name: Install test dependencies without drifting runtime pins
        run: |
          python -m pip install -r requirements-dev.txt -c requirements.lock
          python -m pip check
      - name: Run tests
        run: pytest -q
