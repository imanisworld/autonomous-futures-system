name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, audit/base-489b55b-20261002]

permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: >
          pytest -q
          --deselect=tests/test_research_experiment_spec.py::test_approved_specs_are_frozen_against_origin_main_when_present
          --deselect=tests/test_research_trial_ledger.py::test_trial_ledger_is_append_only_against_origin_main_or_valid_bootstrap
