name: Agent Handoff Check

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  handoff:
    name: handoff-fields
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Validate durable handoff fields
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          body = os.environ.get("PR_BODY") or ""

          required_fields = [
              "Work owner",
              "Implementer",
              "Independent reviewer",
              "Status",
              "Scope",
              "Acceptance criteria",
              "Next agent",
              "Required next action",
          ]

          missing = []
          placeholder = {"", "-", "tbd", "todo", "unknown"}

          for field in required_fields:
              pattern = rf"(?im)^\*\*{re.escape(field)}:\*\*\s*(.*?)\s*$"
              match = re.search(pattern, body)
              if not match:
                  missing.append(f"{field} (missing)")
                  continue
              value = match.group(1).strip()
              if value.lower() in placeholder:
                  missing.append(f"{field} (empty/placeholder)")

          required_sections = [
              "VERIFIED",
              "UNVERIFIED",
              "CONTRADICTED / STALE",
              "Blockers",
              "Exact test commands/results",
              "Files reviewed / changed",
              "Known limitations / remaining unknowns",
          ]

          for section in required_sections:
              pattern = rf"(?im)^\*\*{re.escape(section)}:\*\*"
              if not re.search(pattern, body):
                  missing.append(f"{section} section")

          status = re.search(r"(?im)^\*\*Status:\*\*\s*(.*?)\s*$", body)
          if status:
              allowed = {"IMPLEMENTED", "QA", "BLOCKED", "READY FOR OPERATOR"}
              if status.group(1).strip().upper() not in allowed:
                  missing.append("Status must be IMPLEMENTED / QA / BLOCKED / READY FOR OPERATOR")

          if missing:
              print("Agent handoff check failed:")
              for item in missing:
                  print(f"- {item}")
              print("\nUse .github/pull_request_template.md and fill every durable handoff field.")
              sys.exit(1)

          print("Agent handoff fields present.")
          PY
