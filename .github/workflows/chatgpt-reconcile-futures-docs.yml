name: ChatGPT verify futures docs reconciliation

on:
  push:
    branches: [chatgpt/futures-docs-reconcile-20260901]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply evidence-only docs reconciliation
        run: python scripts/_chatgpt_reconcile_futures_docs.py
      - name: Verify docs-only diff
        run: |
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(["git", "diff", "--name-only"]).decode().splitlines()
          allowed = {
              "docs/strategy-rules/Strategy_Inventory.md",
              "docs/futures-current-state-handoff.md",
              ".github/workflows/chatgpt-reconcile-futures-docs.yml",
              "scripts/_chatgpt_reconcile_futures_docs.py",
          }
          extra = [f for f in files if f not in allowed]
          if extra:
              raise SystemExit(f"unexpected files changed: {extra}")
          PY
          git diff --check
      - name: Commit verified docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: reconcile futures evidence source of truth"
          git push origin HEAD:chatgpt/futures-docs-reconcile-20260901
