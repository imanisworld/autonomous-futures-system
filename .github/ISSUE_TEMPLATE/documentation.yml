name: Documentation feedback
description: Suggest a correction or clarification to public documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Document or page
      description: Link or path to the affected public document.
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Suggested correction
      description: Explain what is unclear or incorrect and the proposed wording.
    validations:
      required: true
