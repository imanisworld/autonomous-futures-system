# requirements.lock — the ONE authoritative production dependency version lock.
#
# Every production dependency, direct and transitive, is pinned to an exact
# version. Release tooling installs ONLY from this file, without dependency
# resolution, and fails closed if the installed version set drifts (U11).
# This is a version lock, not a wheel/artifact hash lock.
#
#   pip install --no-deps --requirement requirements.lock
#   pip check
#   python -m ops.dependency_lock check-freeze --lock requirements.lock --freeze <pip freeze>
#
# requirements.txt stays the human-edited list of direct dependencies
# (Dependabot opens PRs against it). After changing it, regenerate this file
# in a clean Python 3.13 venv, keeping existing pins unless deliberately bumped:
#
#   python -m venv /tmp/lock && /tmp/lock/bin/pip install -r requirements.txt \
#       -c <(grep -v '^#' requirements.lock) \
#     && /tmp/lock/bin/pip check \
#     && /tmp/lock/bin/pip freeze | grep -viE "^(pip|setuptools|wheel)==" | sort -f
#
# tests/test_dependency_lock.py fails if this lock no longer satisfies
# requirements.txt or if production code imports an unlocked distribution.
#
