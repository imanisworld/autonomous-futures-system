# requirements.lock — fully pinned, reproducible runtime install.
#
# Generated from requirements.txt resolved in a clean Python 3.13 venv.
# Use this for deployments so installs are deterministic and supply-chain
# updates are deliberate (Dependabot opens PRs against requirements.txt).
#
#   Install:    pip install -r requirements.lock
#   Regenerate: python -m venv /tmp/lock && /tmp/lock/bin/pip install -r requirements.txt \
#               && /tmp/lock/bin/pip freeze | grep -viE "^(pip|setuptools|wheel)==" | sort
