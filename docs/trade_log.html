<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trade Log</title>
<style>
  :root{
    --bg:#0a0c10;
    --panel:#12151b;
    --panel2:#171b22;
    --border:#232833;
    --text:#e7ebf1;
    --dim:#7d8798;
    --green:#3ecf8e;
    --red:#ef5b5b;
    --amber:#e0a939;
    --accent:#5b8cff;
    --mono: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: var(--mono);
    font-size:13px;
    padding:20px;
  }
  h1{
    font-size:15px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--text); margin:0 0 4px 0; font-weight:700;
  }
  .sub{ color:var(--dim); font-size:12px; margin-bottom:18px; }

  .stats{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:1px; background:var(--border); border:1px solid var(--border);
    margin-bottom:18px; border-radius:6px; overflow:hidden;
  }
  .stat{ background:var(--panel); padding:10px 12px; }
  .stat .val{ font-size:20px; font-weight:700; }
  .stat .lbl{ color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; margin-top:2px;}
  .val.pos{ color:var(--green); }
  .val.neg{ color:var(--red); }

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:6px;
    padding:14px; margin-bottom:16px;
  }
  .panel h2{
    font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--dim);
    margin:0 0 10px 0; font-weight:600;
  }
  .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .grid.wide{ grid-template-columns:repeat(2,1fr); }
  @media(max-width:700px){ .grid, .grid.wide{ grid-template-columns:1fr 1fr; } }

  label{ display:block; color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px;}
  input, select, textarea{
    width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:7px 8px; border-radius:4px; font-family:var(--mono); font-size:12.5px;
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--accent); }
  textarea{ resize:vertical; min-height:44px; }

  .field{ margin-bottom:0; }
  button{
    font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:0.03em;
    padding:8px 16px; border-radius:4px; border:1px solid var(--border); cursor:pointer;
    background:var(--panel2); color:var(--text); text-transform:uppercase;
  }
  button.primary{ background:var(--accent); border-color:var(--accent); color:#0a0c10; }
  button.primary:hover{ filter:brightness(1.1); }
  button:hover{ filter:brightness(1.15); }
  .row-actions{ display:flex; gap:8px; margin-top:12px; justify-content:flex-end; }

  table{ width:100%; border-collapse:collapse; font-size:12px; }
  th{
    text-align:left; color:var(--dim); font-weight:600; text-transform:uppercase;
    font-size:10px; letter-spacing:0.05em; padding:6px 8px; border-bottom:1px solid var(--border);
    position:sticky; top:0; background:var(--panel);
  }
  td{ padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  tr:hover td{ background:var(--panel2); }
  .tbl-wrap{ max-height:420px; overflow:auto; border:1px solid var(--border); border-radius:6px; }

  .badge{ padding:2px 7px; border-radius:3px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; display:inline-block;}
  .badge.open{ background:#233; color:var(--amber); border:1px solid var(--amber); }
  .badge.win{ background:#0f2419; color:var(--green); border:1px solid var(--green); }
  .badge.loss{ background:#2a1414; color:var(--red); border:1px solid var(--red); }

  .pnl.pos{ color:var(--green); font-weight:700; }
  .pnl.neg{ color:var(--red); font-weight:700; }

  .agent-table{ font-size:12px; }
  .agent-table td, .agent-table th{ padding:6px 8px; }

  .empty{ color:var(--dim); text-align:center; padding:24px; font-size:12px; }
  .del{ color:var(--red); cursor:pointer; font-size:11px; background:none; border:none; padding:2px 6px; }
  .del:hover{ text-decoration:underline; }
  .status{ font-size:11px; color:var(--dim); margin-top:8px; min-height:14px; }
  .notes-cell{ max-width:220px; color:var(--dim); font-size:11.5px; }
</style>
</head>
<body>

  <h1>Trade Log</h1>
  <div class="sub">Agent/filter combo → outcome tracking. Data stored locally to this artifact.</div>

  <div class="stats" id="stats"></div>

  <div class="panel">
    <h2>New Entry</h2>
    <div class="grid">
      <div class="field"><label>Date</label><input type="date" id="f-date"></div>
      <div class="field"><label>Ticker</label><input type="text" id="f-ticker" placeholder="V" style="text-transform:uppercase"></div>
      <div class="field"><label>Agent Used</label><input type="text" id="f-agent" placeholder="StageScanner"></div>
      <div class="field"><label>Filter Combo</label><input type="text" id="f-filter" placeholder="Grade B+, Conf 70+, Stage 2"></div>
    </div>
    <div class="grid" style="margin-top:8px;">
      <div class="field"><label>Score/Confidence</label><input type="text" id="f-score" placeholder="75"></div>
      <div class="field"><label>Entry Price</label><input type="text" id="f-entry" placeholder="1.68"></div>
      <div class="field"><label>Status</label>
        <select id="f-status">
          <option value="open">Open</option>
          <option value="win">Win</option>
          <option value="loss">Loss</option>
        </select>
      </div>
      <div class="field"><label>P&L %</label><input type="text" id="f-pnl" placeholder="-18.45"></div>
    </div>
    <div class="grid wide" style="margin-top:8px;">
      <div class="field"><label>Notes</label><textarea id="f-notes" placeholder="Chased entry, no retest. 2 DTE, theta heavy."></textarea></div>
      <div class="field"><label>Trigger / Invalidation</label><textarea id="f-trigger" placeholder="Reclaim 369.11 / invalid below 360.75"></textarea></div>
    </div>
    <div class="row-actions">
      <button id="clear-form">Clear</button>
      <button class="primary" id="add-entry">Add Entry</button>
    </div>
    <div class="status" id="form-status"></div>
  </div>

  <div class="panel">
    <h2>Agent / Filter Performance</h2>
    <div id="agent-perf"><div class="empty">No entries yet.</div></div>
  </div>

  <div class="panel">
    <h2>All Entries</h2>
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th><th>Ticker</th><th>Agent</th><th>Filter</th><th>Score</th>
            <th>Entry</th><th>Status</th><th>P&L%</th><th>Notes</th><th></th>
          </tr>
        </thead>
        <tbody id="log-body">
          <tr><td colspan="10" class="empty">No entries yet — add your first trade above.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

<script>
const STORE_KEY = 'trade_log_entries';
let entries = [];

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
document.getElementById('f-date').value = todayStr();

async function load(){
  try{
    const res = await window.storage.get(STORE_KEY, false);
    entries = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    entries = [];
  }
  render();
}

async function save(){
  try{
    await window.storage.set(STORE_KEY, JSON.stringify(entries), false);
  }catch(e){
    document.getElementById('form-status').textContent = 'Storage error — entry kept in view only, may not persist.';
  }
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function badge(status){
  const cls = status === 'win' ? 'win' : status === 'loss' ? 'loss' : 'open';
  return `<span class="badge ${cls}">${status}</span>`;
}

function render(){
  renderStats();
  renderAgentPerf();
  renderTable();
}

function renderStats(){
  const total = entries.length;
  const closed = entries.filter(e => e.status !== 'open');
  const wins = entries.filter(e => e.status === 'win').length;
  const losses = entries.filter(e => e.status === 'loss').length;
  const open = entries.filter(e => e.status === 'open').length;
  const winRate = closed.length ? Math.round((wins/closed.length)*100) : 0;
  const pnls = entries.filter(e => e.pnl !== '' && !isNaN(parseFloat(e.pnl))).map(e => parseFloat(e.pnl));
  const avgPnl = pnls.length ? (pnls.reduce((a,b)=>a+b,0)/pnls.length).toFixed(1) : '—';

  const stats = [
    {val: total, lbl:'Total Trades'},
    {val: open, lbl:'Open'},
    {val: wins, lbl:'Wins', cls:'pos'},
    {val: losses, lbl:'Losses', cls:'neg'},
    {val: closed.length ? winRate+'%' : '—', lbl:'Win Rate'},
    {val: avgPnl !== '—' ? avgPnl+'%' : '—', lbl:'Avg P&L', cls: avgPnl>0?'pos':avgPnl<0?'neg':''},
  ];
  document.getElementById('stats').innerHTML = stats.map(s =>
    `<div class="stat"><div class="val ${s.cls||''}">${s.val}</div><div class="lbl">${s.lbl}</div></div>`
  ).join('');
}

function renderAgentPerf(){
  const el = document.getElementById('agent-perf');
  if(!entries.length){ el.innerHTML = '<div class="empty">No entries yet.</div>'; return; }

  const groups = {};
  entries.forEach(e => {
    const key = e.agent || 'Unspecified';
    if(!groups[key]) groups[key] = {agent:key, total:0, wins:0, losses:0, open:0, pnlSum:0, pnlCount:0};
    const g = groups[key];
    g.total++;
    if(e.status==='win') g.wins++;
    else if(e.status==='loss') g.losses++;
    else g.open++;
    if(e.pnl !== '' && !isNaN(parseFloat(e.pnl))){ g.pnlSum += parseFloat(e.pnl); g.pnlCount++; }
  });

  const rows = Object.values(groups).sort((a,b) => b.total - a.total).map(g => {
    const closed = g.wins + g.losses;
    const wr = closed ? Math.round((g.wins/closed)*100) : null;
    const avg = g.pnlCount ? (g.pnlSum/g.pnlCount).toFixed(1) : null;
    return `<tr>
      <td>${escapeHtml(g.agent)}</td>
      <td>${g.total}</td>
      <td>${g.wins}</td>
      <td>${g.losses}</td>
      <td>${g.open}</td>
      <td>${wr !== null ? wr+'%' : '—'}</td>
      <td class="${avg>0?'pnl pos':avg<0?'pnl neg':''}">${avg !== null ? avg+'%' : '—'}</td>
    </tr>`;
  }).join('');

  el.innerHTML = `<table class="agent-table">
    <thead><tr><th>Agent</th><th>Total</th><th>Wins</th><th>Losses</th><th>Open</th><th>Win Rate</th><th>Avg P&L</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderTable(){
  const body = document.getElementById('log-body');
  if(!entries.length){
    body.innerHTML = '<tr><td colspan="10" class="empty">No entries yet — add your first trade above.</td></tr>';
    return;
  }
  const sorted = [...entries].sort((a,b) => (b.date||'').localeCompare(a.date||''));
  body.innerHTML = sorted.map(e => {
    const pnlNum = parseFloat(e.pnl);
    const pnlCls = !isNaN(pnlNum) ? (pnlNum >= 0 ? 'pnl pos' : 'pnl neg') : '';
    return `<tr>
      <td>${escapeHtml(e.date)}</td>
      <td><strong>${escapeHtml(e.ticker)}</strong></td>
      <td>${escapeHtml(e.agent)}</td>
      <td>${escapeHtml(e.filter)}</td>
      <td>${escapeHtml(e.score)}</td>
      <td>${escapeHtml(e.entry)}</td>
      <td>${badge(e.status)}</td>
      <td class="${pnlCls}">${e.pnl !== '' ? escapeHtml(e.pnl)+'%' : '—'}</td>
      <td class="notes-cell">${escapeHtml(e.notes)}${e.trigger ? '<br><em>'+escapeHtml(e.trigger)+'</em>' : ''}</td>
      <td><button class="del" data-id="${e.id}">delete</button></td>
    </tr>`;
  }).join('');

  body.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', async () => {
      entries = entries.filter(e => e.id !== btn.dataset.id);
      await save();
      render();
    });
  });
}

document.getElementById('add-entry').addEventListener('click', async () => {
  const ticker = document.getElementById('f-ticker').value.trim().toUpperCase();
  if(!ticker){
    document.getElementById('form-status').textContent = 'Ticker is required.';
    return;
  }
  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    date: document.getElementById('f-date').value || todayStr(),
    ticker,
    agent: document.getElementById('f-agent').value.trim(),
    filter: document.getElementById('f-filter').value.trim(),
    score: document.getElementById('f-score').value.trim(),
    entry: document.getElementById('f-entry').value.trim(),
    status: document.getElementById('f-status').value,
    pnl: document.getElementById('f-pnl').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
    trigger: document.getElementById('f-trigger').value.trim(),
  };
  entries.push(entry);
  await save();
  render();
  document.getElementById('form-status').textContent = 'Entry added.';
  setTimeout(() => document.getElementById('form-status').textContent = '', 1800);
  clearForm();
});

function clearForm(){
  ['f-ticker','f-agent','f-filter','f-score','f-entry','f-pnl','f-notes','f-trigger'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-status').value = 'open';
  document.getElementById('f-date').value = todayStr();
}
document.getElementById('clear-form').addEventListener('click', clearForm);

load();
</script>
</body>
</html>
