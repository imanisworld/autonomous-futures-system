# ─── Order Rules ─────────────────────────────────────────────
order_rules:
  order_type: bracket              # Entry + stop + target required
  require_entry: true
  require_stop: true
  require_target: true

# ─── Risk/Reward ─────────────────────────────────────────────
risk_reward:
  min_rr_ratio: 2.0               # Reject any setup below this

# ─── Data Quality ────────────────────────────────────────────
data_quality:
  max_staleness_seconds: 600       # 10 minutes — TV alert delivery can lag
  reject_null_required_fields: true
  reject_contradictory_data: true  # e.g. high < low
  # Live alerts MUST be created on the 15-minute chart. The whole strategy is
  # tuned and replay-validated on 15m; a 5m (or any other) feed reads trend as
  # WEAK/SIDEWAYS and silently filters every setup. Off-timeframe webhooks are
  # rejected as CONFIG_BLOCKED / TIMEFRAME_MISMATCH, not evaluated as NO_TRADE.
  expected_timeframe_minutes: 15

# ─── Execution Safety ──────────────────────────────────────────
# Later-pipeline-stage gates, complementary to data_quality.max_staleness_seconds
# above (which only guards webhook ingestion lag against the bar close). These
# run at RiskEngine evaluation time (risk/risk_engine.py._check_alert_freshness)
# and immediately before broker.execute_bracket (webhook/runner.py), so they
# also cover internal processing time and a final live broker order-book read.
execution_safety:
  max_alert_age_seconds: null              # unset — log_alert_age_only observes
                                            # real latency before a threshold is set
  reject_on_missing_alert_timestamp: true
  working_order_recheck_enabled: true
  log_alert_age_only: true                 # observe-only: logs age, never rejects for it

# ─── Strategy Permission Gate ─────────────────────────────────────────────
# Separate from every existing strategy/risk gate: those decide whether a
# setup is technically valid; this decides whether that strategy has earned
# the right to reach paper/live execution at all. A strategy not listed below
# (including any new strategy added later) falls back to default_status —
# closed by default, so nothing new can start trading without an explicit,
# reviewed entry here.
#
# vwap_hold is demoted to SHADOW_ONLY: flagged suspect, not yet proven, per
# the 2026-07-09 evidence review. Every other currently-implemented strategy
# keeps its existing (pre-gate) behavior at PAPER_ELIGIBLE — this gate adds a
# floor, it does not silently re-approve or re-deny anything not explicitly
# reviewed. All journaling, shadow candidates, and research/observation paths
# are unaffected either way; this only gates the final TRADE decision.
strategy_permission_gate:
  enabled: true
  default_status: SHADOW_ONLY
  strategy_status:
    orb_breakout: PAPER_ELIGIBLE
    orb_reclaim: PAPER_ELIGIBLE
    orb_rejection: PAPER_ELIGIBLE
    orb_false_break_fade: PAPER_ELIGIBLE
    vwap_hold: SHADOW_ONLY
    vwap_reclaim: PAPER_ELIGIBLE
    vwap_rejection: PAPER_ELIGIBLE
    # pdh_reclaim demoted PAPER_ELIGIBLE -> SHADOW_ONLY 2026-07-16 (operator-approved):
    # tranche 1 REJECTED it (-$4.65/trade MNQ, negative both instruments, docs/
    # strategy-matrix-tranche1-2026-07-14.md) yet it produced a real Tradovate-demo
    # loss 2026-07-15 (-$15.50, 7pt stop, actual R:R 1.90). SHADOW_ONLY (not
    # instrument-disable) deliberately: candidates keep journaling as NO_TRADE +
    # STRATEGY_NOT_PAPER_ELIGIBLE — the observation evidence stream stays alive,
    # same pattern as vwap_hold. MES unaffected either way (already skipped
    # upstream via disabled_concepts_per_instrument since 2026-07-09).
    pdh_reclaim: SHADOW_ONLY
    pdl_reclaim: PAPER_ELIGIBLE
    strat_212: PAPER_ELIGIBLE
    strat_122: PAPER_ELIGIBLE
    strat_122_observed: PAPER_ELIGIBLE
    strat_122_pullback: PAPER_ELIGIBLE
    strat_inside_break: PAPER_ELIGIBLE
    strat_outside_continuation: PAPER_ELIGIBLE
    strat_4hr_retrigger: PAPER_ELIGIBLE
    strat_4hr_retrigger_observed: PAPER_ELIGIBLE
    strat_322_first_live: PAPER_ELIGIBLE
    continuation_pullback: PAPER_ELIGIBLE
    ema_pullback_trend: PAPER_ELIGIBLE
    gap_fill: PAPER_ELIGIBLE
    ovn_high_sweep_reclaim: PAPER_ELIGIBLE
    ovn_low_sweep_reclaim: PAPER_ELIGIBLE
    impulse_first_pullback_observed: PAPER_ELIGIBLE
    trend_consolidation_break_observed: PAPER_ELIGIBLE

# ─── Paper Fill Realism ──────────────────────────────────────
# Applied by PaperBroker in live paper mode AND in replay, so the simulated
# win rate reflects reality instead of optimistic next-bar fills. The legacy
# behavior (0 slippage, target-priority on straddle bars) inflated WR.
fill_model:
  slippage_ticks: 1            # adverse slippage on MARKET fills (entry + stop). Target = clean limit fill.
  pessimistic_both_hit: true   # a bar that hits BOTH stop and target resolves as the STOP (worst case)

# ─── Market Condition Filter ──────────────────────────────────
market_condition:
  tradable_states:
    - TRENDING
    - RANGE_BOUND
  non_tradable_states:
    - CHOPPY
    - DEAD

# ─── Strategy Concepts ───────────────────────────────────────
strategy:
  selection_mode: "ranked"         # first_match | ranked. Enabled: 555-day Polygon replay +$9,727 MNQ / +$2,461 MES vs first_match.
  enabled_concepts:
    # ── Core structural setups ────────────────────────────────
    - orb_breakout            # Initial break above ORB high (long) or below ORB low (short)
    - orb_reclaim             # Price reclaims ORB high after pullback
    - orb_rejection           # Failed ORB breakout, fade back inside
    - vwap_reclaim            # Price crosses above/below VWAP and holds
    - vwap_rejection          # Failed VWAP reclaim attempt — closes back below in downtrend
    - vwap_hold               # Price holding below VWAP in downtrend (two_down bar required)
    - pdh_reclaim             # Previous day high reclaimed
    - pdl_reclaim             # Previous day low reclaimed (breakdown)
    # ── The Strat patterns ───────────────────────────────────
    # Phase 1: approximated from single-bar market_state flags
    # Phase 2: full multi-bar Strat classification available
    - strat_4hr_retrigger     # Canonical 5m-native detector (PR #317), day-only 4PM
      # exit (PR #318). Batch-1 evidence (PR #334, 2026-07-26): MNQ = PROMISING BUT
      # UNPROVEN (positive both chronological halves, stable across 1/2/3-tick
      # slippage) -> forward demo observation. MES = OVERFIT (in-sample edge does
      # not survive walk-forward or slippage stress) -> excluded below via
      # disabled_concepts_per_instrument.MES, no promotion. Superseded the prior
      # 15M-proxy/SHADOW-ONLY posture, which predated the real 5M canonical
      # detector and is no longer accurate. See
      # docs/4hr-retrigger-batch1-evidence-2026-07-26.md for the full evidence.
    - strat_322_first_live    # MNQ-only, day-only (4PM ET flatten). Canonical 5m-native
      # state machine (strategy/strat_322_first_live.py), wired 2026-07-27 from
      # docs/strategy-rules/60M_322_FirstLive_Rules.md + the honest-fill replay's
      # 5-minute entry-recovery fidelity (research/replay_322_honest_fill.py) --
      # NOT research/detector_322_first_live.py's completed-60m-bar shortcut, which
      # is lookahead-unsafe for live use. Evidence (PR #340/#341, 2026-07-26): 34
      # candidates, 21 fills, 20 resolved, 18W-2L, net $1,595.70, PF 10.36, positive
      # both halves/directions, survives 1-4 tick slippage -- PROMISING BUT UNPROVEN,
      # n=34 thin. First runtime wiring for this strategy; MES excluded via
      # disabled_concepts_per_instrument (rules doc: MNQ only, do not trade this
      # setup on any other instrument). See docs/strategy-rules/60M_322_FirstLive_Rules.md.
    - strat_122               # MES only (MNQ excluded via disabled_concepts_per_instrument).
      # Canonical causal two-phase state machine (strategy/strat_212_122.py, PR
      # #317/#337) -- the SAME code path replay and live both call; NOT the older
      # naive shadow-only pattern the "SHADOW-ONLY — strat_122" comment immediately
      # below refers to (that comment predates the causal build). PR #337 evidence
      # (main@8e14795): MES122 PROMISING BUT UNPROVEN. strat_212 stays excluded
      # (MES212 BROKEN, MNQ212/MNQ122 WAIT per the same PR) -- this is a deliberate
      # partial re-enable, not a reversal of strat_212's status.
    # SHADOW-ONLY (stale label — see strat_122 above, re-enabled 2026-07-27 via the
    # causal state machine): no reproducible resolved trades in the verified
    # 77-day journals; wide versions were negative on MES/MNQ Polygon studies.
    # strategy/shadow_setups.py still journals normal structural candidates and
    # stop-aware wide-bar pullbacks so it can earn its way back with evidence.
    # REMOVED — strat_outside_continuation: 0 trades in 237 replay days. Never fired.
    # REMOVED — strat_inside_break: confirmed loser at SUFFICIENT sample on the
    #   2yr Polygon dataset (553 session-days/instrument): MES 79tr 16.9% WR
    #   -$4,138; MNQ 50tr 14.0% WR -$5,556. Negative on BOTH instruments.
    # REMOVED — continuation_pullback: same dataset: MES 54tr 24.0% WR -$2,786;
    #   MNQ 2tr -$141. (Curated 64-day set had it +$836 on 8 trades — the
    #   small-sample noise the 2yr data resolves.)
  frequency: low                   # Bias toward selectivity
  no_trade_is_valid: true          # Explicit acknowledgment

  # Strategies disabled per instrument (overrides enabled_concepts for that instrument)
  disabled_concepts_per_instrument:
    MES:
      # Tuned for highest WR on the 74-day MES 5m backtest (Feb–May 2026):
      #   keep pdh_reclaim + vwap_hold (WR carriers) + strat_4hr_retrigger.
      #   Disabling these three lifts WR 73.0%→73.7%, P&L $40,988→$41,708, PF 7.8→8.0.
      - vwap_reclaim   # 40% WR on MES vs 100% MNQ — reclaim conditions fire too loosely
      - pdl_reclaim    # WR-neutral but P&L-negative: removing it +$2.2k, same WR
      # orb_reclaim RE-ENABLED 2026-06-30: the 74-day finding above ("mild WR drag")
      # optimized for win rate, not total P&L. Re-validated on the full 622-day MES
      # Polygon set: ON adds 127 resolved trades and +$14,982 total P&L (+6.5%,
      # $228,897→$243,880) at the cost of -1.5pt blended WR (51.0%→49.5%) — net
      # positive on the objective that matters (total $), and it is the exact
      # strategy that would have caught the 06-29/06-30 missed-trend-day misses
      # (pdh_reclaim's static PDH-anchor goes stale on fast moves; orb_reclaim's
      # ORB-anchored bracket survives the entry-detachment check on the same bar —
      # verified by direct reconstruction of the 06-30 13:45 MES breakout bar).
      # See AGENT_HANDOFF.md 2026-06-30 entries for full investigation.
      #
      # 2026-07-09 posture narrowing (PRs #236/#237/#238 evidence chain): MES orb_reclaim
      # is the ONLY strategy with validated positive expectancy under honest fills, both
      # walk-forward halves, both exit modes (docs/ioc-faithful-baseline-622d-2026-07-06.md).
      # Everything else below is disabled to make it the sole active MES proof lane.
      # vwap_hold is NOT listed here — already globally SHADOW_ONLY via
      # strategy_permission_gate (risk_rules.yaml strategy_status block), not duplicated.
      # MNQ is intentionally untouched by this posture change — see AGENT_HANDOFF.md
      # 2026-07-09 for the separate, unresolved MNQ gate-timing question that must be
      # investigated before any MNQ posture decision.
      - orb_breakout   # never the validated cell in the #236/#237/#238 evidence chain
      - orb_rejection  # never the validated cell in the #236/#237/#238 evidence chain
      - vwap_rejection # never the validated cell in the #236/#237/#238 evidence chain
      - pdh_reclaim    # loses in 8/8 honest walk-forward half-period cells (ioc-faithful-baseline-622d)
      # 2026-07-26 (PR #334 Batch-1 evidence): strat_4hr_retrigger newly enabled
      # above in enabled_concepts for MNQ forward demo observation. MES is
      # OVERFIT under the canonical fixed-at-entry stop -- a real in-sample edge
      # (H1 net +$801.49) does not survive walk-forward (H2 net -$634.99) or
      # 1-3 tick slippage sensitivity (flips to -$103.50). Excluded here, no
      # promotion. See docs/4hr-retrigger-batch1-evidence-2026-07-26.md.
      - strat_4hr_retrigger
      # strat_322_first_live is MNQ-only per its own hardcoded instrument guard
      # (strategy/strat_322_first_live.py's _SUPPORTED set) and would already
      # no-op for MES; listed explicitly for the same defense-in-depth reason
      # every other MES-inapplicable strategy above is listed rather than
      # relying solely on the code-level guard.
      - strat_322_first_live
    MNQ:
      # 2026-07-27: strat_122 re-enabled ABOVE in enabled_concepts for MES only
      # (PR #337 evidence: MES122 PROMISING BUT UNPROVEN). The SAME PR's MNQ122
      # cell was WAIT (insufficient/negative evidence) -- explicitly excluded
      # here so enabling the MES cell cannot silently also activate the
      # unevidenced MNQ cell. strat_212 needs no entry here: it was never added
      # to enabled_concepts above, so it cannot fire for any instrument.
      - strat_122

  # Per-instrument INITIAL stop-width multiplier (machinery present; values
  # DEFERRED). The 622-day replay showed a blanket MNQ 2.5x lifts vwap setups
  # to ~70% WR but DROPS orb_reclaim (its best, 73.5%) — the wide stop collides
  # with the ORB-anchored stop logic. Needs per-SETUP tuning, not per-instrument.
  # Empty = no change (the runner exit is the validated lever; ship that first).
  stop_multiplier_per_instrument: {}

  # Per-instrument ORB-breakout stop offset (ticks beyond the ORB boundary).
  # Default 8 → ~2.5pt risk on MNQ = noise-width: the trade stops out before the
  # runner's 1R activation can engage. 622-day replay (runner ON, 1c) sweep on
  # MNQ orb_breakout: 8t=43.8% / 16t=50.0% / 32t=70.7% / 48t=80.6% WR (PnL +$3.06k,
  # exp $49/trade) — all losses were STOP_HIT, all wins RUNNER_TRAIL. 48t (12.5pt,
  # within MNQ's 80-tick cap) restores MES-level WR. Per-SETUP so it does NOT touch
  # orb_reclaim (which the blanket multiplier above would break). MES unset (already
  # ~84% with the runner). Replay = fills assumed → live-shadow before trusting.
  # MES 16t = 4pt: live operator value since 07-01 (556-day replay: WR 56%→61%,
  # flat P&L). Ported from the box so canonical main matches live config.
  orb_stop_ticks: {MES: 16, MNQ: 48}

# ─── The Strat Config ────────────────────────────────────────
strat:
  # Candle classification flags used in market_state (Phase 1 approximation)
  # Full multi-bar history required for Phase 2 classification
  candle_types: [inside_bar, two_up, two_down, outside_bar]
  combo_patterns:
    strat_22_continuation:
      sequence: [two_directional, same_directional]
      description: "2-2 continuation — directional expansion continues"
    strat_22_reversal:
      sequence: [two_directional, reverse_directional]
      description: "2-2 reversal — prior directional move fails"
    strat_212:
      sequence: [two_up_or_down, inside_bar, two_up_or_down]
      description: "2-1-2 continuation — compress then extend"
    strat_122:
      sequence: [inside_bar, two_directional, two_reverse]
      description: "1-2-2 reversal — trap then flip"
    strat_312:
      sequence: [outside_bar, inside_bar, two_up_or_down]
      description: "3-1-2 — outside range compresses, then chooses direction"
    strat_322_reversal:
      sequence: [outside_bar, two_directional, two_reverse]
      description: "3-2-2 reversal — expansion, directional move, then reversal"
    strat_4hr_retrigger:
      description: "4AM 2DOWN, 8AM 2UP, NY open dip below 8AM high then reclaim"
    strat_inside_break:
      sequence: [any, inside_bar, two_up_or_down]
      description: "inside bar breakout — compression resolved with trend/VWAP filter"
    strat_outside_continuation:
      sequence: [any, outside_bar, two_up_or_down]
      description: "outside bar follow-through — engulf resolved with volume filter"
  # Detailed proprietary pattern doctrine is intentionally not published here.


# ─── Alpaca Options Lane (Isolated / Disabled by Default) ────────────────────
# Futures webhook execution does not route here. This lane exists so options can
# use futures-style discipline without interfering with MES/MNQ testing.
options_trading:
  enabled: false
  paper_only: true
  allowed_underlyings: [SPY, QQQ]
  allowed_contract_types: [CALL, PUT]
  allowed_sessions: [new_york]
  session_windows:
    new_york:
      - start: "09:35"
        end: "11:30"
        allow: true
        note: "Opening drive after first 5 minutes"
      - start: "13:00"
        end: "15:30"
        allow: true
        note: "Afternoon continuation window"
      - default: false
  max_contracts: 1
  max_premium_per_contract: 250
  max_total_premium: 250
  max_daily_trades: 3
  max_daily_loss: 150
  max_consecutive_losses: 2
  max_open_positions: 1
  require_entry: true
  require_stop: true
  require_target: true
  min_rr_ratio: 2.0
  allow_market_orders: false
  require_confluence_grade: "B"

# ─── Broker ──────────────────────────────────────────────────
# Broker: Tradovate demo (env=demo). Set BROKER=tradovate in .env.
# LIVE_TRADING_ENABLED is permanently false.

capital_guardrails:
  starting_capital_default: 1500
  minimum_starting_capital: 500
  max_account_risk_per_trade_percent: 1.0
  max_daily_loss_percent: 3.0
  require_margin_check: true
