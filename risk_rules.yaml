# ============================================================
# RISK RULES — Autonomous Futures Paper-Trading System
# Version: 1.0.0
# ============================================================
# These values are authoritative. All risk engine checks
# reference this file at runtime. Do not edit without
# incrementing the version and updating CHANGELOG.md.
# ============================================================

version: "1.0.0"

# ─── Trading Mode ────────────────────────────────────────────
trading_mode:
  live_trading_enabled: false       # MUST remain false in Phase 1
  paper_mode: true
  sim_fill_at_entry: true           # Paper broker fills at entry price

# ─── Allowed Universe ────────────────────────────────────────
instruments:
  allowed:
    - MES   # Micro E-mini S&P 500 (active — MES-only ladder while validating live signals)
    # - MNQ   # Micro E-mini NASDAQ-100 — disabled until MNQ sizing rules are added
    # - ES    # E-mini S&P 500 — disabled (full-size, not paper-appropriate yet)
    # - NQ    # E-mini NASDAQ-100 — disabled (full-size)
    # - MGC   # Micro Gold — disabled
    # - MCL   # Micro Crude Oil — disabled

sessions:
  allowed:
    - asian       # Window-gated only — default blocked except session_windows.asian allow periods
    - london      # 03:00–08:30 ET
    - new_york    # 09:30–16:30 ET (entries cut at 14:00 via session_cutoffs_et)
  disabled: []


# Fine-grained session windows. If a session has windows configured,
# entries are blocked by default unless a matching window has allow: true.
session_windows:
  asian:
    - start: "20:00"
      end: "22:00"
      allow: true
      note: "Evening test window — 8pm to 10pm ET"
    - start: "02:00"
      end: "04:00"
      allow: true
      note: "London pre-open and overlap"
    - default: false

session_hours_et:
  london:
    start: "03:00"
    end:   "08:30"
  new_york:
    start: "09:30"
    end:   "16:30"   # entries stop at session_cutoffs_et.new_york (14:00)
  asian:
    start: "19:00"
    end:   "03:00"

# ─── Daily Limits ────────────────────────────────────────────
daily_limits:
  max_trades_per_day: 3             # Hard ceiling, calendar-day reset
  max_consecutive_losses: 3        # Aligns with circuit breaker loss count
  max_daily_loss: 150              # 10% of $1,500 starting balance
  max_drawdown_percent: 0.20       # Stop if account falls 20% from peak
  circuit_breaker_losses: 3        # Pause after 3 consecutive losses
  circuit_breaker_pause_minutes: 30
  conservative_mode: true          # Start Railway paper mode with MES 1c
  bonus_trades_after_max: 2         # After normal max, only A/A+ confluence can add trades
  bonus_min_confluence_grade: "A"
  news_blackout_mode: "reduced"     # off | block | reduced
  news_blackout_max_trades: 1       # On FOMC/news days, allow only one early trade
  news_blackout_cutoff_et: "13:30"  # Stop before 14:00 ET FOMC statement volatility
  news_blackout_dates:              # 2026 FOMC decision days from federalreserve.gov calendar
    - "2026-01-09"
    - "2026-01-15"
    - "2026-01-28"
    - "2026-02-06"
    - "2026-02-12"
    - "2026-03-06"
    - "2026-03-11"
    - "2026-03-18"
    - "2026-04-03"
    - "2026-04-10"
    - "2026-04-29"
    - "2026-05-01"
    - "2026-05-13"
    - "2026-06-05"
    - "2026-06-11"
    - "2026-06-17"
    - "2026-07-02"
    - "2026-07-15"
    - "2026-07-29"
    - "2026-08-07"
    - "2026-08-12"
    - "2026-09-04"
    - "2026-09-10"
    - "2026-09-16"
    - "2026-10-02"
    - "2026-10-14"
    - "2026-10-28"
    - "2026-11-06"
    - "2026-11-12"
    - "2026-12-04"
    - "2026-12-09"
    - "2026-12-10"
  # Early-session loss floor: if realized P&L drops below this within the first
  # N minutes of a session, block new entries for the rest of that session.
  # Prevents revenge trading in the opening window.
  early_session_loss_floor: -75        # dollars — stop if down $75 in first 30m of NY
  early_session_minutes: 30            # window length in minutes from session open
  # Win-streak bonus contracts: after N consecutive wins, allow +1 contract on
  # the next A/A+ setup only. Resets on any loss.
  win_streak_bonus_after: 3            # consecutive wins required
  win_streak_bonus_contracts: 1        # extra contracts allowed
  win_streak_bonus_min_grade: "A"      # minimum confluence grade required
  per_session_limits:
    asian: 1                        # Protect NY budget from overnight fills
    london: 2
    new_york: 5                     # 3 normal + 2 bonus — must match total daily capacity
  session_cutoffs_et:               # No new entries after this time (HH:MM ET)
    london: "08:00"                 # Last call before NY gap
    new_york: "14:00"               # NY open through early afternoon (extended from 11:30)
    asian: "02:30"                  # Thin tape after 2:30 AM ET
  min_target_points:                # Minimum target distance in instrument points
    MNQ: 15
    MES: 15                         # Aligned with MNQ — same structural requirement
    NQ: 15                          # 15 pts × $20/pt = $300 min win at 1c
    ES: 10                          # 10 pts × $50/pt = $500 min win at 1c
    MGC: 0
    MCL: 0
  max_stop_ticks:                   # Backstop rejection if stop still too wide after signal engine caps
    MNQ: 120                        # 120 ticks = 30 pts — hard reject above this
    MES: 60                         # 60 ticks = 15 pts
    NQ: 60                          # 60 ticks = 15 pts = $300 max loss at 1c
    ES: 60                          # 60 ticks = 15 pts = $750 max loss at 1c
    MGC: 0
    MCL: 0

# ─── Setup Quality Gates ─────────────────────────────────────────────────────
quality_gates:
  require_strong_trend:             # Only enter when trend.strength == STRONG
    MNQ: true                       # STRONG required — locked for live replay alignment
    MES: true                       # Aligned with MNQ — STRONG required
    MGC: false
    MCL: false
  min_signal_bar_volume:            # Minimum relative volume on the signal bar
    MNQ: 0.8                        # Locked to 0.8 — match live webhook behavior
    MES: 0.8                        # Aligned with MNQ
    MGC: 0.0
    MCL: 0.0
  require_htf_alignment:            # Require daily/4H FTFC alignment when HTF data is present
    MNQ: false                      # Passive — HTF logged in journal but not blocking
    MES: false
    MGC: false
    MCL: false

# ─── Position Rules ──────────────────────────────────────────
position_rules:
  max_open_positions: 1            # One position at a time
  averaging_down: false            # Absolute prohibition
  discretionary_override: false    # No manual intervention
  max_contracts_per_instrument:
    MNQ: 0                          # Railway paper-only MES ladder for now
    MES: 6                          # Dynamic sizing controls actual MES tier
    ES: 3
    NQ: 2
    MGC: 0
    MCL: 0


# ─── Dynamic Position Sizing / Compounding ───────────────────────────────────
position_sizing:
  starting_balance: 1500
  position_sizing_enabled: true
  aggressive_rounding: false         # Conservative Railway paper launch
  rounding_threshold_percent: 0
  sizing_rules:
    # ── MES-only ladder for Railway paper validation ─────────────
    # Keep one instrument while validating Pine payloads, Railway uptime,
    # journal accuracy, and live paper signal quality.
    - min_balance: 0
      max_balance: 2000
      instrument: "MES"
      max_contracts: 1
    - min_balance: 2000
      max_balance: 4000
      instrument: "MES"
      max_contracts: 2
    - min_balance: 4000
      max_balance: 8000
      instrument: "MES"
      max_contracts: 3
    - min_balance: 8000
      max_balance: 12000
      instrument: "MES"
      max_contracts: 4
    - min_balance: 12000
      max_balance: 18000
      instrument: "MES"
      max_contracts: 5
    - min_balance: 18000
      max_balance: null
      instrument: "MES"
      max_contracts: 6

# ─── Order Rules ─────────────────────────────────────────────
order_rules:
  order_type: bracket              # Entry + stop + target required
  require_entry: true
  require_stop: true
  require_target: true

# ─── Risk/Reward ─────────────────────────────────────────────
risk_reward:
  min_rr_ratio: 2.0               # Reject any setup below this

# ─── Data Quality ────────────────────────────────────────────
data_quality:
  max_staleness_seconds: 600       # 10 minutes — TV alert delivery can lag on 5m charts
  reject_null_required_fields: true
  reject_contradictory_data: true  # e.g. high < low

# ─── Market Condition Filter ──────────────────────────────────
market_condition:
  tradable_states:
    - TRENDING
    - RANGE_BOUND
  non_tradable_states:
    - CHOPPY
    - DEAD

# ─── Strategy Concepts ───────────────────────────────────────
strategy:
  enabled_concepts:
    # ── Core structural setups ────────────────────────────────
    - orb_breakout            # Initial break above ORB high (long) or below ORB low (short)
    - orb_reclaim             # Price reclaims ORB high after pullback
    - orb_rejection           # Failed ORB breakout, fade back inside
    - vwap_reclaim            # Price crosses above/below VWAP and holds
    - vwap_hold               # Price holding below VWAP in downtrend
    - pdh_reclaim             # Previous day high reclaimed
    - pdl_reclaim             # Previous day low reclaimed (breakdown)
    - continuation_pullback   # Trend pullback to VWAP/EMA
    # ── The Strat patterns ───────────────────────────────────
    # Phase 1: approximated from single-bar market_state flags
    # Phase 2: full multi-bar Strat classification available
    - strat_122               # 1-2-2 reversal (1→2→reverse 2)
    - strat_inside_break      # inside bar breakout with trend + VWAP filter
    # SUSPENDED — strat_4hr_retrigger: 4 trades, 25% WR, -$80. Reinstated when 20+ trades.
    # REMOVED   — strat_outside_continuation: 0 trades in 237 replay days. Never fired.
  frequency: low                   # Bias toward selectivity
  no_trade_is_valid: true          # Explicit acknowledgment

  # Strategies disabled per instrument (overrides enabled_concepts for that instrument)
  disabled_concepts_per_instrument:
    MES:
      # orb_reclaim re-enabled: 0% WR was on 5 trades (too small). Requires min B confluence.
      - vwap_reclaim   # 40% WR on MES vs 100% MNQ — reclaim conditions fire too loosely

# ─── The Strat Config ────────────────────────────────────────
strat:
  # Candle classification flags used in market_state (Phase 1 approximation)
  # Full multi-bar history required for Phase 2 classification
  candle_types: [inside_bar, two_up, two_down, outside_bar]
  combo_patterns:
    strat_212:
      sequence: [two_up_or_down, inside_bar, two_up_or_down]
      description: "2-1-2 continuation — compress then extend"
    strat_122:
      sequence: [inside_bar, two_directional, two_reverse]
      description: "1-2-2 reversal — trap then flip"
    strat_4hr_retrigger:
      description: "4AM 2DOWN, 8AM 2UP, NY open dip below 8AM high then reclaim"
    strat_inside_break:
      sequence: [any, inside_bar, two_up_or_down]
      description: "inside bar breakout — compression resolved with trend/VWAP filter"
    strat_outside_continuation:
      sequence: [any, outside_bar, two_up_or_down]
      description: "outside bar follow-through — engulf resolved with volume filter"
  # Reference: sources/strat_definitions.md


# ─── Alpaca Options Lane (Isolated / Disabled by Default) ────────────────────
# Futures webhook execution does not route here. This lane exists so options can
# use futures-style discipline without interfering with MES/MNQ testing.
options_trading:
  enabled: false
  paper_only: true
  allowed_underlyings: [SPY, QQQ]
  allowed_contract_types: [CALL, PUT]
  allowed_sessions: [new_york]
  session_windows:
    new_york:
      - start: "09:35"
        end: "11:30"
        allow: true
        note: "Opening drive after first 5 minutes"
      - start: "13:00"
        end: "15:30"
        allow: true
        note: "Afternoon continuation window"
      - default: false
  max_contracts: 1
  max_premium_per_contract: 250
  max_total_premium: 250
  max_daily_trades: 3
  max_daily_loss: 150
  max_consecutive_losses: 2
  max_open_positions: 1
  require_entry: true
  require_stop: true
  require_target: true
  min_rr_ratio: 2.0
  allow_market_orders: false
  require_confluence_grade: "B"

# ─── Broker ──────────────────────────────────────────────────
# Active: IBKR paper account (DUH623766) via IB Gateway on port 4004.
# LIVE_TRADING_ENABLED is permanently false.

capital_guardrails:
  starting_capital_default: 1500
  minimum_starting_capital: 500
  max_account_risk_per_trade_percent: 1.0
  max_daily_loss_percent: 3.0
  require_margin_check: true
