# ============================================================
# RISK RULES — Autonomous Futures Paper-Trading System
# Version: 1.0.0
# ============================================================
# These values are authoritative. All risk engine checks
# reference this file at runtime. Do not edit without
# incrementing the version and updating CHANGELOG.md.
# ============================================================

version: "1.0.0"

# ─── Trading Mode ────────────────────────────────────────────
trading_mode:
  live_trading_enabled: false       # MUST remain false in Phase 1
  paper_mode: true
  sim_fill_at_entry: true           # Paper broker fills at entry price

# ─── Allowed Universe ────────────────────────────────────────
instruments:
  allowed:
    - MES   # Micro E-mini S&P 500
    - MNQ   # Micro E-mini NASDAQ-100 — same quality gates, separate conservative sizing
    # - ES    # E-mini S&P 500 — disabled (full-size, not paper-appropriate yet)
    # - NQ    # E-mini NASDAQ-100 — disabled (full-size)
    # - MGC   # Micro Gold — disabled
    # - MCL   # Micro Crude Oil — disabled
  # Instruments that MUST stay in `allowed`. If one goes missing (e.g. a stale
  # in-memory config drops MNQ) the dashboard shows a loud CONFIG ERROR.
  required:
    - MES
    - MNQ

sessions:
  allowed:                 # 24h coverage — every market-open hour is eligible
    - asian       # 18:00–02:59 ET (overnight, from the daily reopen)
    - london      # 03:00–09:29 ET (absorbs the old 08:30–09:30 pre-open gap)
    - new_york    # 09:30–16:59 ET (through to the maintenance halt)
  disabled: []

# Schedule mode (Phase 3). Keep "current" for live — DO NOT change on the VPS.
# always_on_* are for offline shadow research / paper only; always_on_paper is
# rejected outright when live_trading_enabled is true.
schedule:
  mode: current            # current | always_on_shadow | always_on_paper
  paper_eligible_sessions: # only these may place PAPER orders under always_on_paper
    - asian
    - london
    - new_york
  # session_gap and off_hours stay shadow-only until they have sufficient evidence.


# Fine-grained session windows. If a session has windows configured,
# entries are blocked by default unless a matching window has allow: true.
session_windows: {}   # RIPPED 2026-06-17 (was asian:default-allow) — no time-window gating (empty = all sessions fully open)

session_hours_et:
  london:
    start: "03:00"
    end:   "09:30"   # absorbs the old 08:30–09:30 pre-open gap
  new_york:
    start: "09:30"
    end:   "17:00"   # through to the daily maintenance halt
  asian:
    start: "18:00"   # the daily CME reopen
    end:   "03:00"

# ─── Daily Limits ────────────────────────────────────────────
daily_limits:
  # ── PSYCHOLOGY/THROTTLE GATES RIPPED 2026-06-17 ──────────────────────────────
  # This is an ALGORITHM, not a person: human throttles (trade-count caps, tilt /
  # revenge-trade halts, news-avoidance, profit-protect) were leaving money on the
  # table. Backtest (556d, honest fills) of gates-off vs gates-on: MES +15.5% P&L /
  # +0.8pp win / +$8 expectancy; MNQ +37% P&L / +1.2pp win / +$8 expectancy — and
  # expectancy PER TRADE rose, so the extra trades are GOOD, not junk. Survival floor
  # (max_daily_loss + max_drawdown_percent) KEPT — those are risk control, not fear.
  # To restore the human throttles, revert this block (values preserved in git).
  max_trades_per_day: 9999          # was 3 — unlimited (validator requires >=1)
  max_consecutive_losses: 9999     # was 4 — tilt halt off (validator requires >=1)
  max_daily_loss: 150              # KEPT — survival floor (10% of $1,500)
  daily_profit_protect_threshold: 0 # off (was already 0)
  max_drawdown_percent: 0.20       # KEPT — survival floor (stop if 20% from peak)
  circuit_breaker_losses: 0        # was 2 — circuit breaker OFF
  circuit_breaker_pause_minutes: 30
  conservative_mode: true          # Conservative: MES 1c while validating signals
  bonus_trades_after_max: 0         # was 2 — moot now max is unlimited
  bonus_min_confluence_grade: "A"
  news_blackout_mode: "off"         # was release_window — news-avoidance OFF (algo, not human)
  news_blackout_max_trades: 1           # (unused in release_window mode)
  news_blackout_cutoff_et: "13:30"      # (unused in release_window mode)
  # release_window: block ONLY a 30-min window centered on each release time.
  # Normal daily limits (max_trades_per_day) govern the rest of the day — the
  # downstream quality gates already filter low-quality trades.
  news_blackout_release_window_minutes: 30
  news_blackout_release_default_et: "08:30"   # most dates below are 8:30 ET data prints
  news_blackout_dates:              # 8:30 ET CPI/NFP unless tagged 14:00 (FOMC)
    - "2026-01-09"
    - "2026-01-15"
    - "2026-01-28 14:00"  # FOMC
    - "2026-02-06"
    - "2026-02-12"
    - "2026-03-06"
    - "2026-03-11"
    - "2026-03-18 14:00"  # FOMC
    - "2026-04-03"
    - "2026-04-10"
    - "2026-04-29 14:00"  # FOMC
    - "2026-05-01"
    - "2026-05-13"
    - "2026-06-05"
    - "2026-06-11"
    - "2026-06-17 14:00"  # FOMC
    - "2026-07-02"
    - "2026-07-15"
    - "2026-07-29 14:00"  # FOMC
    - "2026-08-07"
    - "2026-08-12"
    - "2026-09-04"
    - "2026-09-10"
    - "2026-09-16 14:00"  # FOMC
    - "2026-10-02"
    - "2026-10-14"
    - "2026-10-28 14:00"  # FOMC
    - "2026-11-06"
    - "2026-11-12"
    - "2026-12-04"
    - "2026-12-09 14:00"  # FOMC
    - "2026-12-10"
  # Early-session loss floor: if realized P&L drops below this within the first
  # N minutes of a session, block new entries for the rest of that session.
  # Prevents revenge trading in the opening window.
  early_session_loss_floor: 0          # RIPPED 2026-06-17 (was -75) — revenge-trade floor OFF (algo, not human). 0 = disabled.
  early_session_minutes: 30            # window length in minutes from session open
  # Win-streak bonus contracts: after N consecutive wins, allow +1 contract on
  # the next A/A+ setup only. Resets on any loss.
  win_streak_bonus_after: 3            # consecutive wins required
  win_streak_bonus_contracts: 1        # extra contracts allowed
  win_streak_bonus_min_grade: "A"      # minimum confluence grade required
  per_session_limits: {}            # RIPPED 2026-06-17 (was asian:1/london:1/ny:5) — per-session throttle OFF (algo, not human)
  session_cutoffs_et: {}            # RIPPED 2026-06-17 (was session-end cutoffs) — time-of-day cutoff OFF (24h algo, not human hours)
  min_target_points:                # Minimum target distance in instrument points
    MNQ: 15
    MES: 15                         # Aligned with MNQ — same structural requirement
    NQ: 15                          # 15 pts × $20/pt = $300 min win at 1c
    ES: 10                          # 10 pts × $50/pt = $500 min win at 1c
    MGC: 0
    MCL: 0
  max_stop_ticks:                   # Backstop rejection if stop still too wide after signal engine caps
    MNQ: 120                        # 120 ticks = 30 pts — hard reject above this
    MES: 60                         # 60 ticks = 15 pts
    NQ: 60                          # 60 ticks = 15 pts = $300 max loss at 1c
    ES: 60                          # 60 ticks = 15 pts = $750 max loss at 1c
    MGC: 0
    MCL: 0

# ─── Setup Quality Gates ─────────────────────────────────────────────────────
quality_gates:
  require_strong_trend:             # Only enter when trend.strength == STRONG
    MNQ: true                       # STRONG required — locked for live replay alignment
    MES: true                       # Aligned with MNQ — STRONG required
    MGC: false
    MCL: false
  # Admit MODERATE-trend bars past the STRONG gate (and the pre-setup EMA-stack
  # gate). Validated on the 555-day Polygon replay + a first-half/second-half
  # walk-forward: opens up NY (MODERATE<STRONG was the #1 NY blocker), positive
  # P&L in both halves, and on MES drawdown is shallower AND regime-stable (~$2k
  # both halves vs baseline $3.9k→$2.0k). MNQ-early decayed in the recent half →
  # left off. See scripts/replay_comparison.py (modes: mod_pullback, mod_all).
  allow_moderate_pullback:          # MODERATE w/ full stack intact, price dipped to ema9
    MNQ: true                       # +$7.7k/2yr, expectancy up, drawdown flat — pure win
    MES: true                       # part of MES all-MODERATE (see allow_moderate_early)
    MGC: false
    MCL: false
  allow_moderate_early:             # MODERATE w/ ema55 not yet flipped (trend forming)
    MNQ: false                      # decayed in 2nd half of walk-forward — excluded
    MES: true                       # MES all-MODERATE: +$33k/2yr, drawdown 46% shallower
    MGC: false
    MCL: false
  min_signal_bar_volume:            # Minimum relative volume on the signal bar
    MNQ: 0.8                        # Locked to 0.8 — match live webhook behavior
    MES: 0.8                        # Aligned with MNQ
    MGC: 0.0
    MCL: 0.0
  require_htf_alignment:            # Require daily/4H FTFC alignment when HTF data is present
    MNQ: false                      # Passive — replay over-filtered when active without WR improvement
    MES: false                      # Passive — replay over-filtered when active without WR improvement
    MGC: false
    MCL: false
  min_confluence_grade: "B"         # Reject weak/C setups; require at least 2-of-3 style confirmation

# ─── Position Rules ──────────────────────────────────────────
position_rules:
  max_open_positions: 1            # One position at a time
  averaging_down: false            # Absolute prohibition
  discretionary_override: false    # No manual intervention
  max_contracts_per_instrument:
    MNQ: 6                          # Dynamic sizing controls actual MNQ tier
    MES: 6                          # Dynamic sizing controls actual MES tier
    ES: 3
    NQ: 2
    MGC: 0
    MCL: 0


# ─── Dynamic Position Sizing / Compounding ───────────────────────────────────
position_sizing:
  starting_balance: 1500
  position_sizing_enabled: true
  aggressive_rounding: false         # Conservative launch
  rounding_threshold_percent: 0
  sizing_rules:
    # ── Conservative micro ladders — MES and MNQ share gates, size separately.
    - min_balance: 0
      max_balance: 2000
      instrument: "MES"
      max_contracts: 1
    - min_balance: 0
      max_balance: 2000
      instrument: "MNQ"
      max_contracts: 1
    - min_balance: 2000
      max_balance: 4000
      instrument: "MES"
      max_contracts: 2
    - min_balance: 2000
      max_balance: 4000
      instrument: "MNQ"
      max_contracts: 2
    - min_balance: 4000
      max_balance: 8000
      instrument: "MES"
      max_contracts: 3
    - min_balance: 4000
      max_balance: 8000
      instrument: "MNQ"
      max_contracts: 3
    - min_balance: 8000
      max_balance: 12000
      instrument: "MES"
      max_contracts: 4
    - min_balance: 8000
      max_balance: 12000
      instrument: "MNQ"
      max_contracts: 4
    - min_balance: 12000
      max_balance: 18000
      instrument: "MES"
      max_contracts: 5
    - min_balance: 12000
      max_balance: 18000
      instrument: "MNQ"
      max_contracts: 5
    - min_balance: 18000
      max_balance: null
      instrument: "MES"
      max_contracts: 6
    - min_balance: 18000
      max_balance: null
      instrument: "MNQ"
      max_contracts: 6

# ─── Order Rules ─────────────────────────────────────────────
order_rules:
  order_type: bracket              # Entry + stop + target required
  require_entry: true
  require_stop: true
  require_target: true

# ─── Risk/Reward ─────────────────────────────────────────────
risk_reward:
  min_rr_ratio: 2.0               # Reject any setup below this

# ─── Data Quality ────────────────────────────────────────────
data_quality:
  max_staleness_seconds: 600       # 10 minutes — TV alert delivery can lag
  reject_null_required_fields: true
  reject_contradictory_data: true  # e.g. high < low
  # Live alerts MUST be created on the 15-minute chart. The whole strategy is
  # tuned and replay-validated on 15m; a 5m (or any other) feed reads trend as
  # WEAK/SIDEWAYS and silently filters every setup. Off-timeframe webhooks are
  # rejected as CONFIG_BLOCKED / TIMEFRAME_MISMATCH, not evaluated as NO_TRADE.
  expected_timeframe_minutes: 15

# ─── Paper Fill Realism ──────────────────────────────────────
# Applied by PaperBroker in live paper mode AND in replay, so the simulated
# win rate reflects reality instead of optimistic next-bar fills. The legacy
# behavior (0 slippage, target-priority on straddle bars) inflated WR.
fill_model:
  slippage_ticks: 1            # adverse slippage on MARKET fills (entry + stop). Target = clean limit fill.
  pessimistic_both_hit: true   # a bar that hits BOTH stop and target resolves as the STOP (worst case)

# ─── Market Condition Filter ──────────────────────────────────
market_condition:
  tradable_states:
    - TRENDING
    - RANGE_BOUND
  non_tradable_states:
    - CHOPPY
    - DEAD

# ─── Strategy Concepts ───────────────────────────────────────
strategy:
  selection_mode: "ranked"         # first_match | ranked. Enabled: 555-day Polygon replay +$9,727 MNQ / +$2,461 MES vs first_match.
  enabled_concepts:
    # ── Core structural setups ────────────────────────────────
    - orb_breakout            # Initial break above ORB high (long) or below ORB low (short)
    - orb_reclaim             # Price reclaims ORB high after pullback
    - orb_rejection           # Failed ORB breakout, fade back inside
    - vwap_reclaim            # Price crosses above/below VWAP and holds
    - vwap_rejection          # Failed VWAP reclaim attempt — closes back below in downtrend
    - vwap_hold               # Price holding below VWAP in downtrend (two_down bar required)
    - pdh_reclaim             # Previous day high reclaimed
    - pdl_reclaim             # Previous day low reclaimed (breakdown)
    # ── The Strat patterns ───────────────────────────────────
    # Phase 1: approximated from single-bar market_state flags
    # Phase 2: full multi-bar Strat classification available
    - strat_4hr_retrigger     # 4HR re-trigger — 6 trades 83.3% WR (clean data). Re-enabled.
    # SHADOW-ONLY — strat_122: no reproducible resolved trades in the verified
    # 77-day journals; wide versions were negative on MES/MNQ Polygon studies.
    # strategy/shadow_setups.py still journals normal structural candidates and
    # stop-aware wide-bar pullbacks so it can earn its way back with evidence.
    # REMOVED — strat_outside_continuation: 0 trades in 237 replay days. Never fired.
    # REMOVED — strat_inside_break: confirmed loser at SUFFICIENT sample on the
    #   2yr Polygon dataset (553 session-days/instrument): MES 79tr 16.9% WR
    #   -$4,138; MNQ 50tr 14.0% WR -$5,556. Negative on BOTH instruments.
    # REMOVED — continuation_pullback: same dataset: MES 54tr 24.0% WR -$2,786;
    #   MNQ 2tr -$141. (Curated 64-day set had it +$836 on 8 trades — the
    #   small-sample noise the 2yr data resolves.)
  frequency: low                   # Bias toward selectivity
  no_trade_is_valid: true          # Explicit acknowledgment

  # Strategies disabled per instrument (overrides enabled_concepts for that instrument)
  disabled_concepts_per_instrument:
    MES:
      # Tuned for highest WR on the 74-day MES 5m backtest (Feb–May 2026):
      #   keep pdh_reclaim + vwap_hold (WR carriers) + strat_4hr_retrigger.
      #   Disabling these three lifts WR 73.0%→73.7%, P&L $40,988→$41,708, PF 7.8→8.0.
      - vwap_reclaim   # 40% WR on MES vs 100% MNQ — reclaim conditions fire too loosely
      - orb_reclaim    # mild WR drag: removing it +0.6% WR (leave-one-out)
      - pdl_reclaim    # WR-neutral but P&L-negative: removing it +$2.2k, same WR

# ─── The Strat Config ────────────────────────────────────────
strat:
  # Candle classification flags used in market_state (Phase 1 approximation)
  # Full multi-bar history required for Phase 2 classification
  candle_types: [inside_bar, two_up, two_down, outside_bar]
  combo_patterns:
    strat_212:
      sequence: [two_up_or_down, inside_bar, two_up_or_down]
      description: "2-1-2 continuation — compress then extend"
    strat_122:
      sequence: [inside_bar, two_directional, two_reverse]
      description: "1-2-2 reversal — trap then flip"
    strat_4hr_retrigger:
      description: "4AM 2DOWN, 8AM 2UP, NY open dip below 8AM high then reclaim"
    strat_inside_break:
      sequence: [any, inside_bar, two_up_or_down]
      description: "inside bar breakout — compression resolved with trend/VWAP filter"
    strat_outside_continuation:
      sequence: [any, outside_bar, two_up_or_down]
      description: "outside bar follow-through — engulf resolved with volume filter"
  # Detailed proprietary pattern doctrine is intentionally not published here.


# ─── Alpaca Options Lane (Isolated / Disabled by Default) ────────────────────
# Futures webhook execution does not route here. This lane exists so options can
# use futures-style discipline without interfering with MES/MNQ testing.
options_trading:
  enabled: false
  paper_only: true
  allowed_underlyings: [SPY, QQQ]
  allowed_contract_types: [CALL, PUT]
  allowed_sessions: [new_york]
  session_windows:
    new_york:
      - start: "09:35"
        end: "11:30"
        allow: true
        note: "Opening drive after first 5 minutes"
      - start: "13:00"
        end: "15:30"
        allow: true
        note: "Afternoon continuation window"
      - default: false
  max_contracts: 1
  max_premium_per_contract: 250
  max_total_premium: 250
  max_daily_trades: 3
  max_daily_loss: 150
  max_consecutive_losses: 2
  max_open_positions: 1
  require_entry: true
  require_stop: true
  require_target: true
  min_rr_ratio: 2.0
  allow_market_orders: false
  require_confluence_grade: "B"

# ─── Broker ──────────────────────────────────────────────────
# Broker: Tradovate demo (env=demo). Set BROKER=tradovate in .env.
# LIVE_TRADING_ENABLED is permanently false.

capital_guardrails:
  starting_capital_default: 1500
  minimum_starting_capital: 500
  max_account_risk_per_trade_percent: 1.0
  max_daily_loss_percent: 3.0
  require_margin_check: true
