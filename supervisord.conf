[unix_http_server]
file=/tmp/risksentinel-supervisor.sock

[supervisord]
logfile=%(here)s/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/risksentinel-supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/risksentinel-supervisor.sock

[program:webhook]
command=/bin/sh -c 'exec "$PWD/venv/bin/python3" -m webhook'
directory=%(here)s
autostart=true
autorestart=true
startretries=5
startsecs=3
stopwaitsecs=10
stdout_logfile=%(here)s/logs/webhook.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=%(here)s/logs/webhook.err
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
