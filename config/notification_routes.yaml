# ============================================================
# Notification route → environment-variable mapping
# ============================================================
# Parsed at RUNTIME by notifications/discord_router.py.
#
# This file is the single source of truth for which logical notification
# routes exist and which environment variable holds each route's real URL.
#
# IMPORTANT:
#   - This file contains NO secrets and NO real URLs. Only logical route
#     names and the env var name that carries the destination URL.
#   - heartbeat, signal, and error are REQUIRED. A required route whose env
#     var is unset/blank must fail the startup self-check.
#   - signa, daily_report, deployment, observation, and paper-collection
#     routes are OPTIONAL. An unset optional route is simply disabled (router
#     returns False, logs a warning once).
#   - observation carries ONLY cross_instrument_observation_v1 informational
#     events (candidate/signal detections, structural outcomes), always labelled
#     "OBSERVATION ONLY". Watchdog/transport/error/recovery/safety messages stay
#     on their existing routes.
#   - paper_collection_futures / paper_collection_options carry read-only
#     daily/weekly evidence digests. They are reporting sinks only and are never
#     read by strategy, risk, broker, or execution code.
# ============================================================
routes:
  heartbeat:
    env_var: DISCORD_ROUTE_HEARTBEAT
    required: true
  signal:
    env_var: DISCORD_ROUTE_SIGNAL
    required: true
  signa:
    env_var: DISCORD_ROUTE_SIGNA
    required: false
  error:
    env_var: DISCORD_ROUTE_ERROR
    required: true
  daily_report:
    env_var: DISCORD_ROUTE_DAILY_REPORT
    required: false
  deployment:
    env_var: DISCORD_ROUTE_DEPLOYMENT
    required: false
  observation:
    env_var: DISCORD_ROUTE_OBSERVATION
    required: false
  paper_collection_futures:
    env_var: DISCORD_ROUTE_PAPER_COLLECTION_FUTURES
    required: false
  paper_collection_options:
    env_var: DISCORD_ROUTE_PAPER_COLLECTION_OPTIONS
    required: false
